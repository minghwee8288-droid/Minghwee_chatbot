# Allowlist for bot.minghwee.com, written 2026-11-04. Replaces forward-everything.
# NOT YET RUN: there is no nginx where this was written, and the server's current
# config has not been read. Follow docs/DEPLOY_2026-11-04.md (nginx -T first, back
# up, nginx -t before every reload).
#
# Why X-Forwarded-For is OVERWRITTEN here with $remote_addr, and not appended:
# run.py starts uvicorn with forwarded_allow_ips="*", so the app believes this
# header from anyone. Appending would let a caller choose the address the app sees.

# --- Put these two lines in the http context, for example
#     /etc/nginx/conf.d/bot_limits.conf
limit_req_zone $binary_remote_addr zone=bot_health:1m rate=12r/m;
limit_req_zone $binary_remote_addr zone=bot_suggest:1m rate=60r/m;

# --- Put everything below inside the HTTPS server block for bot.minghwee.com, in
#     place of the existing catch-all `location /`. Leave the port 80 block alone:
#     certificate renewal may depend on it.

# Whapi: POST /webhook/whapi/<secret>. GET /webhook/whapi is the ping Whapi makes
# when the webhook is configured. The app answers everything else under here 404/405.
location /webhook/ {
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location = /health {
    limit_except GET { deny all; }
    limit_req zone=bot_health burst=5 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 10s;
}

# Each request is a database read and at most one Whapi call a minute.
location = /health/ready {
    limit_except GET { deny all; }
    limit_req zone=bot_health burst=5 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 10s;
}

# Reply drafts for the Smart Inbox, called server to server with X-Suggest-Secret.
# Delete this block if the runbook's log check shows nobody calls it.
# 35s is longer than the app's own 25s limit, so a slow draft gets the app's 504.
location = /internal/suggest {
    limit_except POST { deny all; }
    limit_req zone=bot_suggest burst=20 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;
    client_max_body_size 8k;
}

# kb-admin on Vercel renders JavaScript-built pages through this. It answers live
# today, so leaving it out breaks the watcher's "Render with browser" pages. Copy
# the block the server already has if it differs. This is render-service/README.md's.
location /kb-render/ {
    proxy_pass http://127.0.0.1:8100/;
    proxy_read_timeout 90s;
    client_max_body_size 8k;
}

# Everything else, the app's own / and /admin/preview included, stops here.
# If ADMIN_PREVIEW_SECRET is ever set for kb-admin's "Test a question", /admin/preview
# needs its own POST-only block above this.
location / {
    return 404;
}

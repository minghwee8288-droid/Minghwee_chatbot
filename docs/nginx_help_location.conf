# Help (POST /internal/help/answer) for bot.minghwee.com. Two pieces.
# Steps: docs/DEPLOY_HELP.md. The same block is in docs/nginx_allowlist.conf.

# --- 1. In the http context, next to the other limit_req_zone lines (for example
#        /etc/nginx/conf.d/bot_limits.conf; create it if there is none):
limit_req_zone $binary_remote_addr zone=bot_help:1m rate=60r/m;

# --- 2. Inside the HTTPS server block for bot.minghwee.com, ABOVE any catch-all
#        `location /`. An exact-match location wins over the prefix `/` either way,
#        so it works whether or not the allowlist has been applied.
location = /internal/help/answer {
    limit_except POST { deny all; }
    limit_req zone=bot_help burst=20 nodelay;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 25s;
    client_max_body_size 32k;
}

services:
  chatbot:
    build: .
    container_name: minghwee-chatbot
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    # Longer than debouncer.DRAIN_TIMEOUT_SECONDS (45s): a stop lets waiting
    # messages be answered. Docker's default of 10s is shorter than one turn.
    stop_grace_period: 60s
    healthcheck:
      # Parses the body of /health/ready, which always answers 200 (app/healthcheck.py).
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Longer than graph.CHECKPOINTER_RETRY_SECONDS (60s) plus the rest of startup.
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
